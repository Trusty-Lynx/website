<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trusty-Lynx Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="screen">

        <section class="card">
            <div class="logo">
                <img src="zustand_wachsam.png" alt="Trusty Lynx Logo">
            </div>

            <h1 id="subtitle">Deine Passwörter geschützt an einem Ort</h1>
            <p class="auth-subtitle">Melde dich jetzt an!</p>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="email">E-Mail</label>
                    <input id="email" type="email" autocomplete="email" placeholder="name@beispiel.de" required>
                </div>

                <div class="field">
                    <label for="password">Konto-Passwort</label>
                    <div class="input-wrap">
                        <input id="password" type="password" autocomplete="current-password" required>
                        <button type="button" class="toggle" id="toggle-password">Zeigen</button>
                    </div>
                </div>

                <div class="field">
                    <label for="totp-code">Code aus der Authenticator-App</label>
                    <input id="totp-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7"
                        placeholder="123456">
                </div>

                <p class="error" id="auth-error" role="alert"></p>
                <button class="btn primary" id="auth-submit" type="submit">Anmelden</button>
            </form>

            <p class="account-create">
                Noch kein Account?
                <a href="Register.html">Account erstellen</a>
            </p>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4.11.0/dist/argon2.umd.min.js"></script>
    <script src="common.js"></script>
    <script src="Login.js"></script>


</body>

</html>
