<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustyLynx - Dashboard</title>
    <link rel="stylesheet" href="dashboard/dashboard.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="brand">
                <img src="zustand_wachsam.png" alt="Trusty Lynx Logo" class="brand-logo">
            </div>

            <nav class="nav">
                <a href="#/dashboard" class="nav-link active">Dashboard</a>
                <a href="#/tresor" class="nav-link">Tresor</a>
                <a href="#/einstellungen" class="nav-link">Einstellungen</a>
            </nav>

            <button type="button" class="logout" id="logout-button">Abmelden</button>
        </aside>

        <header class="topbar">
            <span class="app-name">TrustyLynx</span>
        </header>

            <main class="content">
            <h1 class="page-title">Hallo!</h1>
            <p class="page-subtitle">Schön, dass du wieder da bist. Hier ist ein Überblick über deinen Tresor.</p>

            <section class="cards">
                <article class="card">
                    <h2 class="card-title">Gespeicherte Passwörter</h2>
                    <p class="card-value" id="stat-count">–</p>
                </article>

                <article class="card">
                    <h2 class="card-title">Sicherheitsstufe</h2>
                    <p class="card-value" id="stat-level">–</p>
                </article>

                <article class="card">
                    <h2 class="card-title">Letzter Login</h2>
                    <p class="card-value" id="stat-last-login">–</p>
                </article>
            </section>

            <section class="card vault">
                <h2 class="vault-title">Tresor</h2>
                <p class="vault-empty" id="vault-empty">Noch keine Einträge vorhanden.</p>
                <ul class="vault-list" id="vault-list"></ul>
            </section>

            <div class="lock" id="lock">
                <div class="lock-box">
                    <p class="error" id="lock-message"></p>

                    <form id="unlock-form" novalidate hidden>
                        <h2 class="lock-title">Tresor entsperren</h2>
                        <div class="field">
                            <label for="unlock-password">Masterpasswort</label>
                            <input id="unlock-password" type="password" autocomplete="current-password" required>
                        </div>
                        <p class="error" id="unlock-error" role="alert"></p>
                        <button class="btn primary" type="submit">Entsperren</button>
                    </form>

                    <form id="create-form" novalidate hidden>
                        <h2 class="lock-title">Tresor erstellen</h2>
                        <div class="field">
                            <label for="create-password">Masterpasswort</label>
                            <input id="create-password" type="password" autocomplete="new-password" required>
                        </div>
                        <div class="field">
                            <label for="create-password-confirm">Masterpasswort wiederholen</label>
                            <input id="create-password-confirm" type="password" autocomplete="new-password" required>
                        </div>
                        <div class="field">
                            <label class="checkbox">
                                <input id="create-confirm" type="checkbox">
                                Ein vergessenes Masterpasswort kann niemand wiederherstellen.
                            </label>
                        </div>
                        <p class="error" id="create-error" role="alert"></p>
                        <button class="btn primary" type="submit">Tresor erstellen</button>
                    </form>

                </div>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4.11.0/dist/argon2.umd.min.js"></script>
    <script src="common.js"></script>
    <script src="dashboard/dashboard.js"></script>
</body>

</html>
