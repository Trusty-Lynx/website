<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="/zustand_wachsam.png" alt="Trusty Lynx Logo" class="brand-logo">
      <span class="brand-name">TrustyLynx</span>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
      <a routerLink="/tresor" routerLinkActive="active" class="nav-link">Tresor</a>
    </nav>

    <div class="sidebar-actions">
      @if (vault.unlocked()) {
        <button type="button" class="nav-button" (click)="vault.lock()">Tresor sperren</button>
      }
      <button type="button" class="nav-button" (click)="auth.logout()">Abmelden</button>
    </div>
  </aside>

  <main class="content">
    @if (vault.unlocked()) {
      <router-outlet />
    } @else {
      <app-lock />
    }
  </main>
</div>
