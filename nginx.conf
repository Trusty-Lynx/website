server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    # There is no index.html; the login page is the entry point.
    index Login.html;

    # Files have no hashed names, so browsers must revalidate after every deploy.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Altes Dashboard (MPA) gibt es nicht mehr, alte Lesezeichen landen in der SPA
    location = /Dashboard.html {
        return 301 /app/;
    }

    # SPA: unbekannte Pfade wie /app/tresor bekommen index.html, den Rest macht der Angular-Router
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
}
