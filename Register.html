<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trusty-Lynx Registrierung</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="screen">

        <section class="card">
            <div class="logo">
                <img src="zustand_wachsam.png" alt="Trusty Lynx Logo">
            </div>

            <h1 id="subtitle">Deine Passwörter geschützt an einem Ort</h1>
            <p class="auth-subtitle">Erstelle jetzt deinen Account!</p>

            <form id="register-form" novalidate>
                <div class="field">
                    <label for="email">E-Mail</label>
                    <input id="email" type="email" autocomplete="email" placeholder="name@beispiel.de" required>
                </div>

                <div class="field">
                    <label for="password">Konto-Passwort</label>
                    <div class="input-wrap">
                        <input id="password" type="password" autocomplete="new-password" minlength="12" required>
                        <button type="button" class="toggle" id="toggle-password">Zeigen</button>
                    </div>
                </div>

                <div class="field">
                    <label for="password-confirm">Passwort wiederholen</label>
                    <input id="password-confirm" type="password" autocomplete="new-password" required>
                </div>

                <p class="hint">Mindestens 12 Zeichen. Wenn du dein Konto-Passwort vergisst, kann es niemand
                    wiederherstellen.</p>

                <p class="error" id="auth-error" role="alert"></p>
                <button class="btn primary" id="auth-submit" type="submit">Account erstellen</button>
            </form>

            <p class="account-create">
                Schon einen Account?
                <a href="Login.html">Anmelden</a>
            </p>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4.11.0/dist/argon2.umd.min.js"></script>
    <script src="common.js"></script>
    <script src="Register.js"></script>

</body>

</html>
